nt-size="12" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Experiences</text><text x="376.0" y="170.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="end" font-family="Instrument Sans,Arial,sans-serif">A flat fee each</text><text x="24.0" y="204.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">You ship what people earn</text><g class="dl" opacity="0" aria-hidden="true"><circle cx="251.0" cy="32.0" r="2.6" fill="var(--ring)"/><text x="257.0" y="36.0" font-size="11" font-weight="600" fill="var(--ink)" font-family="Instrument Sans,Arial,sans-serif">Merchandise costs least</text></g></svg>

<svg class="rv" data-rv="transcript" viewBox="0 0 400 220" role="img" aria-label="A transcript of the Corvane Rail call. Corvane says both sides back the amendment if it carries a set-aside; that phrase is marked." preserveAspectRatio="xMidYMid meet"><text x="24.0" y="40.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">You</text><text x="92.0" y="40.0" font-size="12.0" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Where does Corvane land on the set-aside?</text><text x="24.0" y="72.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Leo</text><text x="92.0" y="72.0" font-size="12.0" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">We need the ten percent in writing.</text><text x="24.0" y="104.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Corvane</text><text x="92.0" y="104.0" font-size="12.0" font-weight="400" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Both sides back the amendment</text><text x="92.0" y="126.0" font-size="12.0" font-weight="500" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif" data-f="1">if it carries a set-aside.</text><rect x="85.0" y="111.2" width="136.7" height="21.8" rx="10.9" stroke="var(--ring)" pathLength="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" data-f="1" /><text x="24.0" y="158.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">You</text><text x="92.0" y="158.0" font-size="12.0" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">I'll take it to council staff Thursday.</text><text x="24.0" y="204.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Corvane Rail call · Today, 11:42</text><g class="dl" opacity="0" aria-hidden="true"><circle cx="105.0" cy="176.0" r="2.6" fill="var(--ring)"/><text x="111.0" y="180.0" font-size="11" font-weight="600" fill="var(--ink)" font-family="Instrument Sans,Arial,sans-serif">Quoted in 2 briefs</text></g></svg>

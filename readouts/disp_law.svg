<svg class="rv" data-rv="disp_law" viewBox="0 0 400 220" role="img" aria-label="S. 2214 section 4(b): not less than ten percent goes to bus lanes. The clause is anchored with a poll cue: keep, change, or cut." preserveAspectRatio="xMidYMid meet"><text x="24.0" y="30.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">S. 2214 · Transit formula grants</text><text x="24.0" y="58.0" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Sec. 4. Set-aside.</text><text x="24.0" y="82.0" font-size="12" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">(a) Each grant funds service</text><text x="24.0" y="102.0" font-size="12" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">on routes in the formula.</text><text x="24.0" y="128.0" font-size="12" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">(b) Not less than</text><text x="24.0" y="152.0" font-size="12" font-weight="500" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">ten percent goes to bus lanes.</text><rect x="17.0" y="137.2" width="179.5" height="21.8" rx="10.9" stroke="var(--ring)" pathLength="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="12" y1="116" x2="12" y2="160" stroke="var(--ring)" stroke-width="3" stroke-linecap="round"/><text x="24.0" y="182.0" font-size="11" font-weight="500" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Poll: keep, change, or cut this clause</text><text x="24.0" y="202.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Text of Oct 7 · one change since Oct 1</text></svg>

<svg class="rv" data-rv="anchors" viewBox="0 0 400 220" role="img" aria-label="Five kinds of anchor, where cues show up: a text span, an image point or area, a video timestamp, a chart label or plot, and a shape in a diagram." preserveAspectRatio="xMidYMid meet"><text x="70.0" y="50.0" font-size="11" font-weight="500" fill="var(--ink)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif" data-f="1">the ten percent</text><rect x="23.3" y="36.2" width="93.3" height="20.4" rx="10.2" stroke="var(--ring)" pathLength="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" data-f="1" /><text x="70.0" y="84.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Text span</text><text x="70.0" y="99.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">a phrase</text><rect x="166.0" y="22.0" width="68.0" height="46.0" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6" opacity="1" /><path d="M170 62 L190 42 L202 52 L212 44 L230 62" fill="none" stroke="var(--ink3)" stroke-width="1.4" data-f="1" /><rect x="206" y="27" width="22" height="13" rx="3" stroke="var(--ring)" pathLength="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" data-f="1" /><circle cx="182" cy="34" r="3" fill="var(--ink)" /><text x="200.0" y="84.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Image</text><text x="200.0" y="99.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">a point or an area</text><line x1="294.0" y1="46.0" x2="366.0" y2="46.0" stroke="var(--ink3)" stroke-width="1.6" stroke-linecap="round" opacity="1" /><line x1="294" y1="46" x2="334" y2="46" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" data-f="1" /><circle cx="3
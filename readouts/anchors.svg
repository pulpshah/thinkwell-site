)" stroke-width="1.6" opacity="1" data-f="1" /><rect x="251" y="132" width="28" height="28" rx="6" stroke="var(--ring)" pathLength="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" data-f="1" /><text x="265.0" y="186.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Diagram</text><text x="265.0" y="201.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">any shape in it</text><g class="dl" opacity="0" aria-hidden="true"><circle cx="17.0" cy="22.0" r="2.6" fill="var(--ring)"/><text x="23.0" y="26.0" font-size="11" font-weight="600" fill="var(--ink)" font-family="Instrument Sans,Arial,sans-serif">5 places a cue can sit</text></g></svg>

<svg class="rv" data-rv="sources" viewBox="0 0 400 220" role="img" aria-label="Sources: news, socials, government, and markets, each listed with what it covers." preserveAspectRatio="xMidYMid meet"><rect x="17.0" y="117.2" width="85.6" height="21.8" rx="10.9" fill="var(--ring)" opacity="0" class="hl" data-f="1" /><text x="24.0" y="36.0" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">News</text><text x="122.0" y="36.0" font-size="11" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Breaking news, opinion, podcasts, video, cartoons,</text><text x="122.0" y="51.0" font-size="11" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">and satire</text><text x="24.0" y="84.0" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Socials</text><text x="122.0" y="84.0" font-size="11" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Bluesky, Reddit, X, Threads, Instagram, TikTok,</text><text x="122.0" y="99.0" font-size="11" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">and YouTube</text><text x="24.0" y="132.0" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif" data-f="1">Government</text><rect x="17.0" y="117.2" width="85.6" height="21.8" rx="10.9" stroke="var(--ring)" pathLength="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" data-f="1" class="lp-ring" /><text x="122.0" y="132.0" font-size="11" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Bills, rules, hearings, courts, elections,</text><text x="122.0" y="147.0" font-size="11" font-weight="400" fill="var(--ink2)" text-a
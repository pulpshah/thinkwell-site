<svg class="rv" data-rv="thread" viewBox="0 0 400 220" role="img" aria-label="A discussion with an aim" preserveAspectRatio="xMidYMid meet"><text x="24.0" y="34.0" font-size="13.0" font-weight="600" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Should Route 9 get bus lanes?</text><path d="M24 46 L24 58 L29 58" stroke="var(--ink3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="40.0" y="62.0" font-size="12.0" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Yes, if deliveries keep a window.</text><path d="M42 74 L42 86 L47 86" stroke="var(--ink3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="58.0" y="90.0" font-size="12.0" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Windows already avoid peak hours.</text><path d="M42 102 L42 114 L47 114" stroke="var(--ink3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="58.0" y="118.0" font-size="12.0" font-weight="500" fill="var(--ink)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif" data-f="1">Then I'm for it.</text><rect x="51.0" y="103.2" width="93.9" height="21.8" rx="10.9" stroke="var(--ring)" pathLength="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" data-f="1" /><path d="M24 130 L24 142 L29 142" stroke="var(--ink3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="40.0" y="146.0" font-size="12.0" font-weight="400" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Add a bike lane too.</text><text x="24.0" y="200.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Recap at 30 minutes: most back the lanes.</text><g class="dl" opacity="0" aria-hidden="true"><circle cx="33.0" cy="164.0" r="2.6" fill="var(--ring)"/><text x="39.0" y="168.0" font-size="11" font-weight="600" fill="var(--ink)" font-family="Instrument Sans,Arial,sans-serif">Recap saved 25 minutes</text></g></svg>

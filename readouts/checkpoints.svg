<svg class="rv" data-rv="checkpoints" viewBox="0 0 400 220" role="img" aria-label="Four checkpoints: at sign-up, at login, at each response when you ask, and an ID check before a payout." preserveAspectRatio="xMidYMid meet"><text x="24.0" y="34.0" font-size="11" font-weight="600" fill="var(--ink2)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">Where people are checked</text><line x1="60.0" y1="92.0" x2="336.0" y2="92.0" stroke="var(--ink3)" stroke-width="1.6" stroke-linecap="round" opacity="1" class="l-draw" style="--i:0.00" pathLength="1" /><circle cx="60.0" cy="92.0" r="8" fill="var(--ink)" stroke="var(--ink)" stroke-width="1.6" opacity="1" /><text x="60.0" y="128.0" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Sign-up</text><text x="60.0" y="146.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Once</text><circle cx="152.0" cy="92.0" r="8" fill="var(--ink)" stroke="var(--ink)" stroke-width="1.6" opacity="1" /><text x="152.0" y="128.0" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Login</text><text x="152.0" y="146.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Passkeys are free</text><circle cx="244.0" cy="92.0" r="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6" opacity="1" /><text x="244.0" y="128.0" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Each response</text><text x="244.0" y="146.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">When you ask</text><circle cx="336.0" cy="92.0" r="8" fill="var(--ink)" stroke="var(--ink)" stroke-width="1.6" opacity="1" /><text x="336.0" y="128.0" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">Payout</text><text x="336.0" y="146.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="middle" font-family="Instrument Sans,Arial,sans-serif">ID before a reward</text><circle cx="336" cy="92" r="15" stroke="var(--ring)" pathLength="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" class="l-pulse" /><text x="24.0" y="204.0" font-size="11" font-weight="400" fill="var(--ink3)" text-anchor="start" font-family="Instrument Sans,Arial,sans-serif">A passed check carries through the session</text></svg>
